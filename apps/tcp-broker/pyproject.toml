[project]
name = "tcp-broker"
version = "0.1.0"
description = "Standalone message broker spoken over plain TCP (the server for tcp:// broker URLs)."
requires-python = ">=3.13"
dependencies = ["messaging", "servicekit"]

[project.scripts]
tcp-broker = "tcp_broker.main:main"

[tool.uv.sources]
messaging = { workspace = true }
servicekit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcp_broker"]
