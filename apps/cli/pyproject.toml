[project]
name = "cli"
version = "0.1.0"
description = "Example deployable app that depends on the core library."
requires-python = ">=3.13"
dependencies = ["core"]

[project.scripts]
cli = "cli.main:main"

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
