[project]
name = "messaging"
version = "0.1.0"
description = "Tiny message-broker abstraction (in-memory for tests, Redis in production)."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9", "redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]
