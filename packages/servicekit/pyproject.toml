[project]
name = "servicekit"
version = "0.1.0"
description = "Common service plumbing: settings, logging and an HTTP app factory."
requires-python = ">=3.13"
dependencies = ["pydantic-settings>=2.6"]

[project.optional-dependencies]
# Only HTTP services need FastAPI; workers depend on plain `servicekit`
# so their images stay small.
http = ["fastapi>=0.115", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicekit"]
