[project]
name = "contracts"
version = "0.1.0"
description = "Shared data models (API payloads and events) exchanged between services."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
