[project]
name = "python-monorepo"
version = "0.0.0"
description = "Workspace root for the Python monorepo (not published)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "contracts",
    "messaging",
    "servicekit",
    "cli",
    "catalog_api",
    "orders_api",
    "notifier_worker",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = [
    "packages/core/src",
    "packages/contracts/src",
    "packages/messaging/src",
    "packages/servicekit/src",
    "apps/cli/src",
    "apps/catalog-api/src",
    "apps/orders-api/src",
    "apps/notifier-worker/src",
]
explicit_package_bases = true
files = ["packages", "apps", "scripts"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["packages", "apps"]
