[project]
name = "python-monorepo"
version = "0.0.0"
description = "Workspace root for the Python monorepo (not published)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["core", "cli"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "packages/core/src:apps/cli/src"
explicit_package_bases = true
files = ["packages", "apps", "scripts"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["packages", "apps"]
