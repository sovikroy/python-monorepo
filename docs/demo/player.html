<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>python-monorepo demo</title>
<!--
  Replays real terminal sessions captured from this repo on a fixed timeline.
  record.mjs drives it frame by frame (window.seek(t)) and ffmpeg turns the frames
  into one GIF + MP4 per demo. Open it in a browser to watch it play live:

    player.html                 the overview  -> docs/demo.gif, docs/demo.mp4
    player.html?demo=brokers    the transport -> docs/brokers.gif, docs/brokers.mp4
-->
<style>
  :root {
    --bg: #0b0f17; --panel: #111722; --border: #232c3b; --text: #d6deeb; --dim: #7d8799;
    --green: #7ee787; --blue: #79c0ff; --yellow: #f2cc60; --red: #ff7b72; --violet: #d2a8ff;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 960px; height: 600px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, "DejaVu Sans", sans-serif; color: var(--text); position: relative; }

  .header { position: absolute; left: 28px; right: 28px; top: 20px; height: 74px; }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .kicker b { color: var(--accent); font-weight: 600; }
  .title { font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: -.01em; }
  .sub { font-size: 13.5px; color: var(--dim); margin-top: 5px; min-height: 18px; }
  .sub em { color: var(--text); font-style: normal; }

  .topo { margin-left: auto; display: flex; align-items: center; gap: 6px;
          font: 500 11px "JetBrains Mono", "DejaVu Sans Mono", monospace; }
  .node { padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel);
          color: var(--dim); white-space: nowrap; }
  .node.on { border-color: var(--accent); color: var(--text); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
  .node.broker { border-style: dashed; }
  .node.broker.on { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(242,204,96,.15); }
  .edge { color: #3a4456; font-size: 9.5px; text-align: center; line-height: 1.05; }
  .edge.on { color: var(--yellow); }

  .term { position: absolute; left: 28px; right: 28px; top: 108px; bottom: 34px;
          background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 12px;
         border-bottom: 1px solid var(--border); flex: none; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #2d3545; }
  .bar .name { margin-left: 10px; font: 12px "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--dim); }
  .pane { padding: 10px 14px; font: 13px/19px "JetBrains Mono", "DejaVu Sans Mono", monospace;
          white-space: pre-wrap; word-break: break-all; overflow: hidden; }
  .main { flex: 1; }
  .logs { flex: none; height: 118px; border-top: 1px solid var(--border); background: #0d121b;
          font-size: 11.5px; line-height: 16px; padding-top: 8px; }
  .logs .label { color: var(--violet); font-size: 11px; margin-bottom: 3px; }
  .logs .tag { display: inline-block; min-width: 18px; margin-right: 6px; padding: 0 4px; border-radius: 3px;
               background: #1f2a3c; color: var(--blue); text-align: center; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--text);
            vertical-align: -3px; }

  .p { color: var(--green); } .c { color: var(--text); } .o { color: #aab4c5; }
  .g { color: var(--green); } .b { color: var(--blue); } .y { color: var(--yellow); }
  .r { color: var(--red); } .v { color: var(--violet); } .d { color: var(--dim); }
  .flash { background: rgba(242,204,96,.12); }

  .progress { position: absolute; left: 28px; right: 28px; bottom: 14px; height: 4px; display: flex; gap: 6px; }
  .seg { flex: 1; background: #1b2230; border-radius: 2px; overflow: hidden; }
  .seg i { display: block; height: 100%; background: var(--accent); width: 0; }

  .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
          padding: 0 84px; background: var(--bg); }
  .card h1 { font-size: 44px; letter-spacing: -.02em; font-weight: 700; }
  .card h1 span { color: var(--accent); }
  .card p { font-size: 18px; color: var(--dim); margin-top: 12px; line-height: 1.5; }
  .card p code, .card li code { font: 0.92em "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--text); }
  .card ul { list-style: none; margin-top: 26px; }
  .card li { font-size: 19px; margin: 12px 0; display: flex; gap: 14px; align-items: baseline; }
  .card li b { font: 600 14px "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--accent); width: 34px; flex: none; }
  .card .foot { margin-top: 30px; font: 14px "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="header" id="header">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="term" id="term">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="name" id="termname">~/python-monorepo</span>
     <div class="topo" id="topo">
      <div class="node" id="n-catalog">catalog-api</div>
      <div class="edge" id="e-http">HTTP<br>◀──</div>
      <div class="node" id="n-orders">orders-api</div>
      <div class="edge" id="e-pub">publish<br>──▶</div>
      <div class="node broker" id="n-broker">Redis</div>
      <div class="edge" id="e-sub">consume<br>──▶</div>
      <div class="node" id="n-worker">notifier-worker</div>
     </div>
    </div>
    <div class="pane main" id="main"></div>
    <div class="pane logs" id="logs"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="card" id="card"></div>

<script>
// ---------------------------------------------------------------- content
// Output below is copied verbatim from real runs of this repo (services started with
// `uv run`, Redis from redis-server, TCP from apps/tcp-broker); the commands are the
// ones that were run, minus nohup and log redirection. Only colour markup, the
// "#1"/"#2" replica tags in the log pane and "…" where a long log line is cut are added.
// Markup: [g]..[/] green, [b] blue, [y] yellow, [r] red, [v] violet, [d] dim.
const ORDER_CMD =
  `curl -s -X POST localhost:8002/orders -H 'content-type: application/json' \\\n` +
  `    -d '{"customer_email": "ada@example.com",\n` +
  `         "items": [{"sku": "MUG-001", "quantity": 2}, {"sku": "BOOK-001", "quantity": 1}]}' \\\n` +
  `    | jq -c '{id, total_cents, status}'`;
const BAD_CMD =
  `curl -s -X POST localhost:8002/orders -H 'content-type: application/json' \\\n` +
  `    -d '{"customer_email":"ada@example.com","items":[{"sku":"NOPE","quantity":1}]}' -w '\\nHTTP %{http_code}\\n'`;
const FANOUT_CMD =
  `for e in ada grace alan linus; do curl -s -X POST localhost:8002/orders \\\n` +
  `    -H 'content-type: application/json' \\\n` +
  `    -d "{\\"customer_email\\":\\"$e@example.com\\",\\"items\\":[{\\"sku\\":\\"TEE-001\\",\\"quantity\\":1}]}" \\\n` +
  `    | jq -c '{id, total_cents}'; done`;

const W = "[d]2026-11-04 ";  // log timestamp prefix
const LOG = {
  redisListen: `${W}19:55:40,270[/] INFO [v][notifier-worker][/] notifier_worker.worker: listening on orders.placed via [b]RedisBroker[/]`,
  redisNotify: `${W}19:55:40,979[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=ada@example.com subject='Order c89a7462 confirmed' body='Thanks for your order of 3 item(s). Total: $54.99.'[/]`,
  tcpServer:   `${W}19:55:59,555[/] INFO [v][tcp-broker][/] tcp_broker.main: listening on 0.0.0.0:7000`,
  tcpListen:   `${W}19:56:01,068[/] INFO [v][notifier-worker][/] notifier_worker.worker: listening on orders.placed via [b]TcpBroker[/]`,
  tcpNotify:   `${W}19:56:01,438[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=ada@example.com subject='Order d7ad167d confirmed' body='Thanks for your order of 3 item(s). Total: $54.99.'[/]`,
  w2Listen:    `${W}19:57:34,553[/] INFO [v][notifier-worker][/] notifier_worker.worker: listening on orders.placed via [b]TcpBroker[/]`,
  fan: [
    ["#1", `${W}19:57:36,347[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=ada@example.com subject='Order 68769bf2 confirmed'[/] …`],
    ["#2", `${W}19:57:36,361[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=grace@example.com subject='Order c58953a7 confirmed'[/] …`],
    ["#1", `${W}19:57:36,373[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=alan@example.com subject='Order 3110f86a confirmed'[/] …`],
    ["#2", `${W}19:57:36,385[/] INFO [v][notifier-worker][/] notifier_worker.worker: [y]notify to=linus@example.com subject='Order 1f17992d confirmed'[/] …`],
  ],
};
const KAFKA_ERR = `messaging.broker.BrokerError: unsupported broker URL 'kafka://localhost:9092'; known schemes: [b]amqp, amqps, memory, redis, rediss, tcp[/]`;

// Scene building blocks shared by both demos.
const redisFlow = (extra = []) => [
  { log: LOG.redisListen, at: 0 },
  { wait: 0.6 },
  { cmd: `curl -s localhost:8001/products | jq -c '.[]'`, cps: 40, on: ["n-catalog"] },
  { out: [
    `{"sku":"BOOK-001","name":"The Pragmatic Monorepo","price_cents":2999}`,
    `{"sku":"MUG-001","name":"Coffee mug","price_cents":1250}`,
    `{"sku":"TEE-001","name":"T-shirt","price_cents":1999}`] },
  { wait: 1.2 },
  { sub: "Placing an order: <em>orders-api</em> prices it by calling <em>catalog-api</em>, then publishes an <em>OrderPlaced</em> event." },
  { cmd: ORDER_CMD, cps: 75, on: ["n-orders"] },
  { on: ["n-orders", "n-catalog", "e-http"], wait: 0.35 },
  { out: [`{"id":"c89a7462bdf6415cbdbbf658a6bba7a4","total_cents":[y]5499[/],"status":"[g]placed[/]"}`],
    on: ["n-orders", "n-broker", "e-pub"] },
  { wait: 0.5 },
  { on: ["n-broker", "n-worker", "e-sub"], log: LOG.redisNotify,
    sub: "…and the worker takes the event off the queue and sends the confirmation." },
  { wait: 2.2 },
  ...extra,
];

const tcpSwap = [
  { wait: 0.4 },
  { cmd: `uv run tcp-broker &`, cps: 30 },
  { out: [], log: LOG.tcpServer, on: ["n-broker"], broker: "tcp-broker" },
  { wait: 0.6 },
  { cmd: `export BROKER_URL=tcp://localhost:7000     [d]# was redis://localhost:6379/0[/]`, cps: 60, on: [] },
  { out: [], wait: 0.4 },
  { cmd: `PORT=8002 uv run orders-api &  uv run notifier-worker &`, cps: 45 },
  { out: [], log: LOG.tcpListen, on: ["n-worker"],
    sub: "Same images, same code. The worker now reports <em>TcpBroker</em> instead of <em>RedisBroker</em>." },
  { wait: 1.6 },
  { cmd: ORDER_CMD, cps: 80, on: ["n-orders"] },
  { on: ["n-orders", "n-catalog", "e-http"], wait: 0.35 },
  { out: [`{"id":"d7ad167d5e0044498190cb039a0424e9","total_cents":[y]5499[/],"status":"[g]placed[/]"}`],
    on: ["n-orders", "n-broker", "e-pub"] },
  { wait: 0.5 },
  { on: ["n-broker", "n-worker", "e-sub"], log: LOG.tcpNotify,
    sub: "The order flows exactly as before, now over plain TCP." },
  { wait: 2.4 },
];

const DEMOS = {
  // ============================================================ docs/demo.gif
  overview: [
    { kind: "card", dur: 3.4, html: `
        <h1>python-<span>monorepo</span></h1>
        <p>Independently deployable Python services and the libraries they share,<br>
           in one uv workspace with one lockfile.</p>
        <div class="foot">4 short demos · real commands · real output</div>` },

    { kind: "term", title: "Services talk over HTTP and a broker, not imports",
      sub: "<em>catalog-api</em>, <em>orders-api</em> and <em>notifier-worker</em> run as separate processes, wired through a message broker (Redis here).",
      topo: true, logs: true, broker: "Redis",
      steps: redisFlow([
        { on: [], sub: "Unknown products are rejected, and no event is published." },
        { cmd: BAD_CMD, cps: 75, on: ["n-orders"] },
        { on: ["n-orders", "n-catalog", "e-http"], wait: 0.3 },
        { out: [`{"detail":"unknown product 'NOPE'"}`, `HTTP [r]422[/]`], on: [] },
        { wait: 2.2 },
      ]) },

    { kind: "term", title: "Swap the broker, not the code",
      sub: "<em>BROKER_URL</em> picks the transport: <em>redis://</em>, <em>amqp://</em> (RabbitMQ), <em>tcp://</em> or <em>memory://</em>.",
      topo: true, logs: true, broker: "Redis",
      steps: [
        ...tcpSwap,
        { on: [], sub: "A typo or an unsupported broker fails at start-up, naming the schemes that work." },
        { cmd: `BROKER_URL=kafka://localhost:9092 uv run notifier-worker`, cps: 50 },
        { out: [`[r]${KAFKA_ERR.replace(/\[b\]|\[\/\]/g, "")}[/]`] },
        { wait: 2.8 },
      ] },

    { kind: "term", title: "CI tests only what a change can break",
      sub: "<em>scripts/ci/affected.py</em> maps changed files to members, then adds everything that depends on them.",
      steps: [
        { wait: 0.4 },
        { cmd: `python3 scripts/ci/affected.py --files packages/messaging/src/messaging/broker.py >/dev/null`, cps: 55 },
        { out: [
          `  affected: [b]messaging[/] (packages/messaging)`,
          `  affected: [b]notifier-worker[/] (apps/notifier-worker)`,
          `  affected: [b]orders-api[/] (apps/orders-api)`,
          `  affected: [b]tcp-broker[/] (apps/tcp-broker)`],
          sub: "Change a shared library → it and the <em>3 apps</em> that use it are tested (plus real-broker and end-to-end jobs). The other 5 members are skipped." },
        { wait: 2.8 },
        { cmd: `python3 scripts/ci/affected.py --files apps/orders-api/src/orders_api/service.py >/dev/null`, cps: 55 },
        { out: [`  affected: [b]orders-api[/] (apps/orders-api)`],
          sub: "Change one service → only that service is tested." },
        { wait: 2.2 },
        { cmd: `python3 scripts/ci/affected.py --files README.md >/dev/null`, cps: 55 },
        { out: [], sub: "Docs-only change → no test jobs at all (lint still runs)." },
        { wait: 2.4 },
      ] },

    { kind: "term", title: "A new service, fully wired, in one command",
      sub: "The <em>new-service</em> Claude Code skill runs this scaffold, then writes the real logic and tests.",
      steps: [
        { wait: 0.4 },
        { cmd: `python3 .claude/skills/new-service/scripts/scaffold.py inventory-api --kind http --broker`, cps: 50 },
        { out: [
          `  wrote [g]apps/inventory-api/pyproject.toml[/]`,
          `  wrote [g]apps/inventory-api/Dockerfile[/]`,
          `  wrote [g]apps/inventory-api/src/inventory_api/__init__.py[/]`,
          `  wrote [g]apps/inventory-api/src/inventory_api/py.typed[/]`,
          `  wrote [g]apps/inventory-api/src/inventory_api/main.py[/]`,
          `  wrote [g]apps/inventory-api/src/inventory_api/app.py[/]`,
          `  wrote [g]apps/inventory-api/src/inventory_api/service.py[/]`,
          `  wrote [g]apps/inventory-api/tests/test_inventory_api.py[/]`,
          `  wrote [y]pyproject.toml[/]`,
          `  wrote [y]compose.yaml[/]`,
          `  compose: http://localhost:8003`], stagger: 0.07,
          sub: "Package, Dockerfile, starter tests, ruff + mypy config, and a <em>compose.yaml</em> entry that follows whichever broker is selected." },
        { wait: 1.8 },
        { cmd: `uv sync --all-packages -q && uv run ruff check . && uv run mypy \\\n    && uv run pytest -q --disable-warnings apps/inventory-api`, cps: 50 },
        { wait: 0.5 },
        { out: [`[g]All checks passed![/]`], running: true },
        { wait: 0.6 },
        { out: [`[g]Success: no issues found in 53 source files[/]`], running: true },
        { wait: 0.3 },
        { out: [`.                                                                        [100%]`,
                 `[g]1 passed[/], 1 warning in 0.30s`],
          sub: "Lint, strict type checks and tests pass straight away. CI picks the new member up automatically." },
        { wait: 2.8 },
      ] },

    { kind: "card", dur: 4.6, html: `
        <h1>python-<span>monorepo</span></h1>
        <ul>
          <li><b>01</b>Each service ships as its own small image; they talk over HTTP and a broker.</li>
          <li><b>02</b>The broker is a plug: Redis, RabbitMQ or TCP, chosen by <code>BROKER_URL</code>.</li>
          <li><b>03</b>CI tests only what changed, plus whatever depends on it.</li>
          <li><b>04</b>New services start fully wired and checked.</li>
        </ul>
        <div class="foot">uv sync --all-packages · docker compose up --build · see ARCHITECTURE.md</div>` },
  ],

  // ============================================================ docs/brokers.gif
  brokers: [
    { kind: "card", dur: 3.6, html: `
        <h1>A pluggable <span>transport</span></h1>
        <p>Services code against one <code>Broker</code> interface.<br>
           <code>BROKER_URL</code> decides whether Redis, RabbitMQ or a plain TCP broker carries the events.</p>
        <div class="foot">4 short demos · real commands · real output</div>` },

    { kind: "term", title: "The stack on Redis",
      sub: "Start Redis, point the services at it with <em>BROKER_URL</em>, and run them with <em>uv run</em>.",
      topo: true, logs: true, broker: "Redis",
      steps: [
        { wait: 0.3 },
        { cmd: `redis-server --daemonize yes --save ''`, cps: 40, on: ["n-broker"] },
        { out: [], wait: 0.3 },
        { cmd: `export BROKER_URL=redis://localhost:6379/0`, cps: 45 },
        { out: [], wait: 0.3 },
        { cmd: `PORT=8001 uv run catalog-api &  PORT=8002 uv run orders-api &  uv run notifier-worker &`, cps: 55,
          on: ["n-catalog", "n-orders", "n-broker", "n-worker"] },
        { out: [] },
        ...redisFlow(),
      ] },

    { kind: "term", title: "Swap Redis for the TCP broker: one variable",
      sub: "<em>apps/tcp-broker</em> is a dependency-free broker server. Restart <em>orders-api</em> and the worker with a <em>tcp://</em> URL.",
      topo: true, logs: true, broker: "Redis",
      steps: tcpSwap },

    { kind: "term", title: "Scale out: each event goes to exactly one worker",
      sub: "The broker is a work queue. A second <em>notifier-worker</em> shares the load instead of sending duplicates.",
      topo: true, logs: true, broker: "tcp-broker", workers: "notifier-worker ×2", logsH: 205,
      steps: [
        { log: LOG.tcpListen, tag: "#1", at: 0 },
        { wait: 0.4 },
        { cmd: `uv run notifier-worker &          [d]# a second replica[/]`, cps: 40, on: ["n-worker"] },
        { out: [], log: LOG.w2Listen, tag: "#2" },
        { wait: 1.0 },
        { cmd: FANOUT_CMD, cps: 85, on: ["n-orders"] },
        { on: ["n-orders", "n-catalog", "e-http", "n-broker", "e-pub"] },
        { out: [
          `{"id":"68769bf2122d449b8f3e84120eda5d20","total_cents":[y]1999[/]}`,
          `{"id":"c58953a7871c40e98602f9cadf529577","total_cents":[y]1999[/]}`,
          `{"id":"3110f86aba1d429d8bcc090334febb77","total_cents":[y]1999[/]}`,
          `{"id":"1f17992daf654210b3a74440e9918eb9","total_cents":[y]1999[/]}`], stagger: 0.12 },
        { on: ["n-broker", "n-worker", "e-sub"] },
        ...LOG.fan.map(([tag, log]) => ({ log, tag, wait: 0.35 })),
        { sub: "Four orders, four notifications, split between replicas <em>#1</em> and <em>#2</em>. Every backend keeps this promise." },
        { wait: 3.0 },
      ] },

    { kind: "term", title: "Every backend passes the same contract tests",
      sub: "<em>packages/messaging</em> runs one test suite against each transport. Real servers join in when their URL is set.",
      steps: [
        { wait: 0.4 },
        { cmd: `MESSAGING_TEST_REDIS_URL=redis://localhost:6379/0 \\\n    uv run pytest packages/messaging/tests/test_messaging.py -v -k test_fifo`, cps: 55 },
        { out: [
          `packages/messaging/tests/test_messaging.py::test_fifo[[b]memory[/]] [g]PASSED[/]     [ 20%]`,
          `packages/messaging/tests/test_messaging.py::test_fifo[[b]fakeredis[/]] [g]PASSED[/]  [ 40%]`,
          `packages/messaging/tests/test_messaging.py::test_fifo[[b]tcp[/]] [g]PASSED[/]        [ 60%]`,
          `packages/messaging/tests/test_messaging.py::test_fifo[[b]redis[/]] [g]PASSED[/]      [ 80%]`,
          `packages/messaging/tests/test_messaging.py::test_fifo[[b]rabbitmq[/]] [y]SKIPPED[/]  [100%]`,
          `[y]SKIPPED[/] [1] packages/messaging/tests/test_messaging.py:24: MESSAGING_TEST_AMQP_URL not set`,
          `================= [g]4 passed[/], [y]1 skipped[/], 41 deselected in 0.46s ==================`], stagger: 0.1,
          sub: "Locally RabbitMQ is skipped. CI's <em>brokers</em> job runs the suite against real Redis <em>and</em> RabbitMQ." },
        { wait: 2.6 },
        { cmd: `MESSAGING_TEST_REDIS_URL=redis://localhost:6379/0 uv run pytest packages/messaging -q | tail -1`, cps: 60 },
        { out: [`[g]62 passed[/], [y]11 skipped[/] in 3.41s`],
          sub: "FIFO order, timeouts, independent topics, large and non-ASCII payloads, concurrent publishers." },
        { wait: 1.8 },
        { cmd: `BROKER_URL=kafka://localhost:9092 uv run notifier-worker`, cps: 50,
          sub: "And a broker that isn't registered fails at start-up, not at the first message." },
        { out: [KAFKA_ERR] },
        { wait: 2.8 },
      ] },

    { kind: "card", dur: 4.4, html: `
        <h1>A pluggable <span>transport</span></h1>
        <ul>
          <li><b>01</b>Services depend on the <code>Broker</code> interface only.</li>
          <li><b>02</b><code>BROKER_URL</code> picks Redis, RabbitMQ, TCP or in-memory.</li>
          <li><b>03</b>Work-queue delivery: add replicas to share the load.</li>
          <li><b>04</b>Add Kafka, NATS, SQS… with one class and <code>register_backend()</code>.</li>
        </ul>
        <div class="foot">docker compose --env-file brokers/&lt;name&gt;.env up --build</div>` },
  ],
};

const DEMO = new URLSearchParams(location.search).get("demo") || "overview";
const SCENES = DEMOS[DEMO];
window.DEMOS = Object.keys(DEMOS);

// ---------------------------------------------------------------- timeline
const PROMPT = "[g]❯[/] ";
function compile(scene) {
  // Turn steps into timed events: {t, type, ...}
  let t = 0; const ev = [];
  for (const s of scene.steps) {
    if (s.sub) ev.push({ t, type: "sub", html: s.sub });
    if (s.on) ev.push({ t, type: "on", ids: s.on });
    if (s.broker) ev.push({ t, type: "broker", name: s.broker });
    if (s.cmd !== undefined) {
      const plain = s.cmd.replace(/\[([gbyrvd])\]|\[\/\]/g, "");
      const d = plain.length / (s.cps || 40);
      ev.push({ t, type: "cmd", text: s.cmd, len: plain.length, dur: d });
      t += d + 0.25;
    }
    if (s.log !== undefined) ev.push({ t, type: "log", text: s.log, tag: s.tag });
    if (s.out) {
      const st = s.stagger || 0;
      s.out.forEach((line, i) => ev.push({ t: t + i * st, type: "out", text: line }));
      if (!s.running) ev.push({ t: t + s.out.length * st, type: "prompt" });
      t += s.out.length * st + 0.15;
    }
    if (s.wait) t += s.wait;
  }
  scene.events = ev; scene.dur = t;
}
SCENES.forEach(s => s.kind === "term" && compile(s));
let acc = 0; for (const s of SCENES) { s.start = acc; acc += s.dur; }
window.DURATION = acc;

// ---------------------------------------------------------------- render
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const mark = s => esc(s).replace(/\[([gbyrvd])\]/g, '<span class="$1">').replace(/\[\/\]/g, "</span>");
// Type the first n visible characters of a marked-up string, keeping its colours.
const typed = (s, n) => {
  let out = "", seen = 0;
  for (const part of s.split(/(\[[gbyrvd]\]|\[\/\])/)) {
    if (/^\[([gbyrvd])\]$|^\[\/\]$/.test(part)) { out += part; continue; }
    const take = Math.max(0, Math.min(part.length, n - seen));
    out += part.slice(0, take); seen += take;
  }
  const opened = (out.match(/\[[gbyrvd]\]/g) || []).length, closed = (out.match(/\[\/\]/g) || []).length;
  return mark(out) + "</span>".repeat(Math.max(0, opened - closed));
};
const $ = id => document.getElementById(id);

const bar = $("progress");
const termScenes = SCENES.filter(s => s.kind === "term");
termScenes.forEach((s, i) => { s.n = i + 1; const d = document.createElement("div"); d.className = "seg"; d.innerHTML = "<i></i>"; bar.appendChild(d); });

window.seek = function (T) {
  const scene = SCENES.find(s => T >= s.start && T < s.start + s.dur) || SCENES[SCENES.length - 1];
  const t = T - scene.start;
  const isCard = scene.kind === "card";
  $("card").classList.toggle("hidden", !isCard);
  ["header", "term", "progress"].forEach(id => $(id).classList.toggle("hidden", isCard));
  termScenes.forEach((s, i) => {
    const f = T >= s.start + s.dur ? 1 : T < s.start ? 0 : (T - s.start) / s.dur;
    bar.children[i].firstChild.style.width = (f * 100).toFixed(2) + "%";
  });
  if (isCard) { if ($("card").dataset.k !== String(scene.start)) { $("card").innerHTML = scene.html; $("card").dataset.k = scene.start; } return; }

  $("kicker").innerHTML = `<b>${scene.n} / ${termScenes.length}</b> &nbsp;·&nbsp; python-monorepo`;
  $("title").textContent = scene.title;
  $("topo").classList.toggle("hidden", !scene.topo);
  $("logs").classList.toggle("hidden", !scene.logs);
  $("logs").style.height = (scene.logsH || 118) + "px";
  $("n-worker").textContent = scene.workers || "notifier-worker";

  let sub = scene.sub, on = [], logs = [], lines = [PROMPT], typing = false, broker = scene.broker || "Redis";
  for (const e of scene.events) {
    if (e.t > t) break;
    if (e.type === "sub") sub = e.html;
    else if (e.type === "on") on = e.ids;
    else if (e.type === "broker") broker = e.name;
    else if (e.type === "log") logs.push(e);
    else if (e.type === "out") lines.push(mark(e.text) + "\n");
    else if (e.type === "prompt") lines.push(PROMPT);
    else if (e.type === "cmd") {
      const n = Math.min(e.len, Math.floor((t - e.t) / e.dur * e.len));
      const done = t >= e.t + e.dur;
      lines[lines.length - 1] = { html: mark(lines[lines.length - 1]) + `<span class="c">${typed(e.text, n)}</span>` + (done ? "\n" : "") };
      typing = !done;
    }
  }
  $("sub").innerHTML = sub;
  $("n-broker").textContent = broker;
  ["n-catalog", "n-orders", "n-broker", "n-worker", "e-http", "e-pub", "e-sub"]
    .forEach(id => $(id).classList.toggle("on", on.includes(id)));

  // Compose main pane; the last line gets the cursor (blinks while idle).
  const html = lines.map(l => typeof l === "string" ? (l === PROMPT ? mark(l) : l) : l.html).join("");
  const blinkOn = typing || Math.floor(t * 1.8) % 2 === 0;
  const main = $("main");
  main.innerHTML = html + (blinkOn ? '<span class="cursor"></span>' : '<span class="cursor" style="opacity:0"></span>');
  main.scrollTop = main.scrollHeight;

  if (scene.logs) {
    const el = $("logs");
    el.innerHTML = '<div class="label">service logs</div>' +
      logs.map(l => `<div class="${t - l.t < 1.6 && l.t > 0 ? "flash" : ""}">` +
        (l.tag ? `<span class="tag">${l.tag}</span>` : "") + `${mark(l.text)}</div>`).join("");
    el.scrollTop = el.scrollHeight;
  }
};

// Live playback when opened directly (record.mjs sets ?record to drive frames itself).
if (!new URLSearchParams(location.search).has("record")) {
  const t0 = performance.now();
  const tick = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
}
</script>
</body>
</html>
